<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spark Mosaic</title>
<style>
  :root{
    --bg: #faf9f6;
    --ink: #2b2a2e;
    --sub: #6b6a72;
    --footer-ink: #4a4952;
    --teal:   #00a99d;
    --magenta:#ec1e6f;
    --gold:   #f5a623;
    --orange: #f47b20;
    --purple: #7b3fa0;
    --blue:   #29abe2;
    --panel: transparent;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg: #17161a;
      --ink: #f3f2f0;
      --sub: #a3a1ab;
      --footer-ink: #c2c0c9;
      --panel: rgba(255,255,255,0.92);
    }
  }
  :root[data-theme="dark"]{
    --bg: #17161a;
    --ink: #f3f2f0;
    --sub: #a3a1ab;
    --footer-ink: #c2c0c9;
    --panel: rgba(255,255,255,0.92);
  }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); height:100%; }
  *{ margin:0; padding:0; }
  body{
    height:100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Quicksand', system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    position: relative;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: background .4s ease, color .4s ease;
  }

  /* --- soft background glow behind logo --- */
  .glow{
    position:absolute;
    top:50%; left:50%;
    width: min(70vw, 760px);
    height: min(70vw, 760px);
    transform: translate(-50%,-50%);
    background:
      radial-gradient(circle at 35% 30%, rgba(236,30,111,0.14), transparent 55%),
      radial-gradient(circle at 65% 65%, rgba(41,171,226,0.14), transparent 55%),
      radial-gradient(circle at 50% 50%, rgba(245,166,35,0.10), transparent 60%);
    filter: blur(20px);
    animation: glowDrift 26s ease-in-out infinite;
    pointer-events:none;
  }

  @keyframes glowDrift{
    0%,100%{ transform: translate(-50%,-50%) scale(1); }
    50%{ transform: translate(-50%,-52%) scale(1.06); }
  }

  /* --- stage --- */
  .stage{
    position: relative;
    width: 100%;
    max-width: 900px;
    padding: 0 24px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    z-index: 2;
  }

  .logo-wrap{
    position:relative;
    display:inline-block;
    opacity:0;
    transform: translateY(10px) scale(0.97);
    animation: logoIn 0.9s cubic-bezier(.2,.7,.2,1) forwards;
    animation-delay: 0.95s;
  }
  .logo-panel{
    position:absolute;
    inset: -18px -22px;
    background: var(--panel);
    border-radius: 28px;
    backdrop-filter: blur(6px);
    z-index:-1;
  }
  .logo-wrap img{
    display:block;
    width: min(72vw, 460px);
    height:auto;
  }

  @keyframes logoIn{
    to{ opacity:1; transform: translateY(0) scale(1); }
  }

  .tagline{
    margin-top: 22px;
    font-size: clamp(0.95rem, 1.6vw, 1.15rem);
    color: var(--sub);
    font-weight: 500;
    letter-spacing: 0.01em;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards;
    animation-delay: 1.5s;
  }
  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }

  /* --- decorative triangle pieces --- */
  .piece-orbit{
    position:absolute;
    width: 0; height: 0;
    left: 50%; top: 50%;
  }
  .piece{
    position:absolute;
    width: 0;
    height: 0;
    opacity: 0;
    will-change: transform, opacity;
  }
  .piece .float{
    animation: idleFloat 14s ease-in-out infinite;
    animation-delay: inherit;
  }
  .tri{
    width:0; height:0;
    border-style: solid;
  }

  @keyframes idleFloat{
    0%,100%{ transform: translate(0,0) rotate(0deg); }
    50%{ transform: translate(0,-10px) rotate(4deg); }
  }

  /* entrance: each piece flies in from an off-screen direction then settles */
  .p1{ animation: flyIn1 1.05s cubic-bezier(.16,.8,.3,1) forwards; animation-delay: .05s; }
  .p2{ animation: flyIn2 1.05s cubic-bezier(.16,.8,.3,1) forwards; animation-delay: .15s; }
  .p3{ animation: flyIn3 1.05s cubic-bezier(.16,.8,.3,1) forwards; animation-delay: .0s; }
  .p4{ animation: flyIn4 1.05s cubic-bezier(.16,.8,.3,1) forwards; animation-delay: .2s; }
  .p5{ animation: flyIn5 1.05s cubic-bezier(.16,.8,.3,1) forwards; animation-delay: .1s; }
  .p6{ animation: flyIn6 1.05s cubic-bezier(.16,.8,.3,1) forwards; animation-delay: .25s; }
  .p7{ animation: flyIn1 1.05s cubic-bezier(.16,.8,.3,1) forwards; animation-delay: .3s; }
  .p8{ animation: flyIn4 1.05s cubic-bezier(.16,.8,.3,1) forwards; animation-delay: .0s; }

  @keyframes flyIn1{ from{ opacity:0; transform: translate(-60vw,-40vh) rotate(-30deg) scale(.6); } to{ opacity: var(--op,0.5); transform: translate(var(--x),var(--y)) rotate(var(--r)) scale(1); } }
  @keyframes flyIn2{ from{ opacity:0; transform: translate(60vw,-30vh) rotate(40deg) scale(.6); } to{ opacity: var(--op,0.5); transform: translate(var(--x),var(--y)) rotate(var(--r)) scale(1); } }
  @keyframes flyIn3{ from{ opacity:0; transform: translate(-55vw,35vh) rotate(20deg) scale(.6); } to{ opacity: var(--op,0.5); transform: translate(var(--x),var(--y)) rotate(var(--r)) scale(1); } }
  @keyframes flyIn4{ from{ opacity:0; transform: translate(60vw,40vh) rotate(-25deg) scale(.6); } to{ opacity: var(--op,0.5); transform: translate(var(--x),var(--y)) rotate(var(--r)) scale(1); } }
  @keyframes flyIn5{ from{ opacity:0; transform: translate(0,-55vh) rotate(15deg) scale(.6); } to{ opacity: var(--op,0.5); transform: translate(var(--x),var(--y)) rotate(var(--r)) scale(1); } }
  @keyframes flyIn6{ from{ opacity:0; transform: translate(0,55vh) rotate(-15deg) scale(.6); } to{ opacity: var(--op,0.5); transform: translate(var(--x),var(--y)) rotate(var(--r)) scale(1); } }

  /* fine ticks like the sketch: small line / dot accents */
  .tick{
    position:absolute;
    opacity:0;
    animation: tickIn 0.7s ease forwards;
  }
  @keyframes tickIn{ to{ opacity: var(--op, 0.55); } }

  footer{
    position:absolute;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    left:0; right:0;
    text-align:center;
    font-size: 0.85rem;
    color: var(--footer-ink);
    opacity: 0;
    animation: fadeUp 0.8s ease forwards;
    animation-delay: 1.8s;
    letter-spacing: 0.02em;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
  }
  footer a{
    color: var(--footer-ink);
    text-decoration: none;
    transition: color .2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  footer svg{
    flex-shrink: 0;
    opacity: 0.85;
  }
  footer a:hover, footer a:focus-visible{
    color: var(--ink);
  }
  footer a:focus-visible{
    outline: 1px solid var(--sub);
    outline-offset: 3px;
    border-radius: 3px;
  }
  footer .dot{
    opacity: 0.5;
  }

  .top-nav{
    position:absolute;
    top: calc(24px + env(safe-area-inset-top, 0px));
    right: 28px;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards;
    animation-delay: 1.65s;
    z-index: 3;
  }
  .top-nav a{
    display:inline-flex;
    align-items:center;
    padding: 10px 16px;
    border: 1px solid #e5e0e8;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.82);
    color: #172544;
    font-weight: 700;
    font-size: 0.85rem;
    text-decoration: none;
    backdrop-filter: blur(10px);
    transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
  }
  .top-nav a:hover{
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(23, 37, 68, 0.10);
  }
  .top-nav a:focus-visible{
    outline: 2px solid #7b3fa0;
    outline-offset: 3px;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      .top-nav a{
        background: rgba(30, 29, 34, 0.72);
        border-color: rgba(255,255,255,0.14);
        color: #f3f2f0;
      }
      .top-nav a:hover{
        box-shadow: 0 8px 22px rgba(0,0,0,0.35);
      }
    }
  }
  :root[data-theme="dark"] .top-nav a{
    background: rgba(30, 29, 34, 0.72);
    border-color: rgba(255,255,255,0.14);
    color: #f3f2f0;
  }
  :root[data-theme="dark"] .top-nav a:hover{
    box-shadow: 0 8px 22px rgba(0,0,0,0.35);
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
    .logo-wrap{ opacity:1; transform:none; }
    .tagline{ opacity:1; transform:none; }
    footer{ opacity:1; }
    .piece{ opacity: var(--op, 0.5) !important; transform: translate(var(--x),var(--y)) rotate(var(--r)) !important; }
    .tick{ opacity: var(--op, 0.55) !important; }
  }
</style>
</head>
<body>

  <div class="glow"></div>

  <nav class="top-nav">
    <a href="https://play.sparkmosaic.net">SparkMosaic Play ↗</a>
  </nav>

  <!-- decorative mosaic triangles, positioned relative to center, echoing the logo's triangle motif -->
  <div class="piece-orbit">
    <div class="piece p1" style="--x:-260px; --y:-150px; --r:-18deg; --op:0.55;">
      <div class="float" style="animation-delay:.3s;"><div class="tri" style="border-width: 0 22px 34px 22px; border-color: transparent transparent var(--magenta) transparent;"></div></div>
    </div>
    <div class="piece p2" style="--x:250px; --y:-170px; --r:22deg; --op:0.5;">
      <div class="float" style="animation-delay:1.1s;"><div class="tri" style="border-width: 0 16px 26px 16px; border-color: transparent transparent var(--teal) transparent;"></div></div>
    </div>
    <div class="piece p3" style="--x:-300px; --y:120px; --r:12deg; --op:0.45;">
      <div class="float" style="animation-delay:.6s;"><div class="tri" style="border-width: 0 14px 22px 14px; border-color: transparent transparent var(--blue) transparent;"></div></div>
    </div>
    <div class="piece p4" style="--x:280px; --y:150px; --r:-14deg; --op:0.55;">
      <div class="float" style="animation-delay:1.6s;"><div class="tri" style="border-width: 0 20px 32px 20px; border-color: transparent transparent var(--gold) transparent;"></div></div>
    </div>
    <div class="piece p5" style="--x:-40px; --y:-230px; --r:8deg; --op:0.4;">
      <div class="float" style="animation-delay:2.0s;"><div class="tri" style="border-width: 0 12px 20px 12px; border-color: transparent transparent var(--purple) transparent;"></div></div>
    </div>
    <div class="piece p6" style="--x:60px; --y:230px; --r:-10deg; --op:0.4;">
      <div class="float" style="animation-delay:.9s;"><div class="tri" style="border-width: 0 12px 20px 12px; border-color: transparent transparent var(--orange) transparent;"></div></div>
    </div>
    <div class="piece p7" style="--x:-190px; --y:-40px; --r:30deg; --op:0.3;">
      <div class="float" style="animation-delay:1.4s;"><div class="tri" style="border-width: 0 9px 15px 9px; border-color: transparent transparent var(--orange) transparent;"></div></div>
    </div>
    <div class="piece p8" style="--x:210px; --y:20px; --r:-24deg; --op:0.3;">
      <div class="float" style="animation-delay:.2s;"><div class="tri" style="border-width: 0 9px 15px 9px; border-color: transparent transparent var(--magenta) transparent;"></div></div>
    </div>

    <!-- fine accent ticks, echoing the sketch (small lines / dots) -->
    <span class="tick" style="left:-330px; top:-60px; --op:0.5; animation-delay:1.7s;">
      <svg width="4" height="22" viewBox="0 0 4 22"><rect width="4" height="22" rx="2" fill="var(--purple)"/></svg>
    </span>
    <span class="tick" style="left:320px; top:-90px; --op:0.45; animation-delay:1.9s;">
      <svg width="4" height="4" viewBox="0 0 4 4"><circle cx="2" cy="2" r="2" fill="var(--blue)"/></svg>
    </span>
    <span class="tick" style="left:-300px; top:190px; --op:0.4; animation-delay:1.5s;">
      <svg width="4" height="4" viewBox="0 0 4 4"><circle cx="2" cy="2" r="2" fill="var(--gold)"/></svg>
    </span>
    <span class="tick" style="left:330px; top:210px; --op:0.5; animation-delay:2.1s;">
      <svg width="4" height="20" viewBox="0 0 4 20"><rect width="4" height="20" rx="2" fill="var(--teal)"/></svg>
    </span>
  </div>

  <div class="stage">
    <div class="logo-wrap">
      <div class="logo-panel"></div>
      <img src="assets/spark-mosaic-logo.png" alt="Spark Mosaic">
    </div>
    <p class="tagline">Creative digital experiences, thoughtfully made.</p>
  </div>

  <footer>
    <a href="mailto:info@sparkmosaic.net">
      <svg width="15" height="12" viewBox="0 0 15 12" fill="none"><rect x="0.75" y="0.75" width="13.5" height="10.5" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M1 1.5L7.5 6.5L14 1.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      info@sparkmosaic.net
    </a>
    <span class="dot">·</span>
    <a href="https://play.sparkmosaic.net/privacy" target="_blank" rel="noopener">
      <svg width="13" height="14" viewBox="0 0 13 14" fill="none"><path d="M6.5 1L12 3V6.5C12 9.8 9.7 12.4 6.5 13.5C3.3 12.4 1 9.8 1 6.5V3L6.5 1Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
      Privacy
    </a>
  </footer>

</body>
</html>
